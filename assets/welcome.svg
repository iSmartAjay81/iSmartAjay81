<svg width="1200" height="300" viewBox="0 0 1200 300"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>

  <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00C7FF"/>
    <stop offset="50%" stop-color="#7F00FF"/>
    <stop offset="100%" stop-color="#00C7FF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="300" rx="25" fill="url(#bg)"/>

<circle cx="100" cy="70" r="3" fill="#00C7FF">
  <animate attributeName="cy"
           values="70;220;70"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1100" cy="220" r="3" fill="#7F00FF">
  <animate attributeName="cy"
           values="220;60;220"
           dur="5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="70" r="2" fill="#FFFFFF">
  <animate attributeName="opacity"
           values="0;1;0"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="300" cy="220" r="2" fill="#FFFFFF">
  <animate attributeName="opacity"
           values="1;0;1"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<text x="600" y="125"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="54"
      font-weight="bold"
      fill="url(#text)"
      filter="url(#glow)">
  Hi, I'm Ajay
</text>

<text x="600" y="175"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      fill="#FFFFFF">
  B.Tech CSE • Java • DSA • Web Development
</text>

<line x1="350" y1="205" x2="850" y2="205"
      stroke="#00C7FF"
      stroke-width="2"
      opacity="0.7">

  <animate attributeName="x1"
           values="350;500;350"
           dur="3s"
           repeatCount="indefinite"/>

  <animate attributeName="x2"
           values="850;700;850"
           dur="3s"
           repeatCount="indefinite"/>

</line>

</svg>
